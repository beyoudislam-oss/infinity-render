(function() {
  // Helper: rounded rectangle
  function rrect(c, x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function lgrad(c, x1, y1, x2, y2, stops) {
    const g = c.createLinearGradient(x1, y1, x2, y2);
    for (let i = 0; i < stops.length; i++) {
      g.addColorStop(stops[i][0], stops[i][1]);
    }
    return g;
  }

  // Helper: radial gradient
  function rgrad(c, x1, y1, r1, x2, y2, r2, stops) {
    const g = c.createRadialGradient(x1, y1, r1, x2, y2, r2);

  // --- BG DRAWING (Sky, Sun, Clouds, Skyline, River, Far Beams) ---
  function drawBG(c, t, view, P) {
    c.save();

    if (view === 'top') {
      // Top down view
      c.fillStyle = lgrad(c, 0, 0, 0, 200, P.topSkyStops);
      c.fillRect(0, 0, 1920, 200);

      c.fillStyle = P.topStreetFill;
      c.fillRect(0, 0, 1920, 120);

      for (let i = 0; i < 8; i++) {
        let cx = ((t * 80 + i * 240) % 2100) - 100;
        let cy = 40 + (i % 2) * 35;
        c.fillStyle = i % 2 === 0 ? P.carHeadlight : P.carTaillight;
        c.beginPath(); c.arc(cx, cy, 3, 0, Math.PI * 2); c.fill();
        c.fillStyle = i % 2 === 0 ? 'rgba(255, 230, 150, 0.25)' : 'rgba(255, 80, 80, 0.25)';
        c.beginPath(); c.arc(cx, cy, 8, 0, Math.PI * 2); c.fill();
      }
      c.restore();
      return;
    }

    const isLow = (view === 'low');
    const horizonY = isLow ? 720 : 510;
    const sunX = P.getSunX(view, isLow);
    const sunY = P.getSunY(view, isLow);

    // 1. Sky Gradient
    const skyG = lgrad(c, 0, 0, 0, horizonY, P.skyStops);
    c.fillStyle = skyG;
    c.fillRect(0, 0, 1920, horizonY + 20);

    // 2. Sun Glow & Core / Moon
    if (P.isNight) {
      // Moon Glow
      const moonGlow = rgrad(c, sunX, sunY, 10, sunX, sunY, 260, P.sunGlowStops);
      c.fillStyle = moonGlow;
      c.beginPath(); c.arc(sunX, sunY, 260, 0, Math.PI * 2); c.fill();

      // Moon Disc & Crater Rim
      c.fillStyle = P.sunCore1;
      c.beginPath(); c.arc(sunX, sunY, 28, 0, Math.PI * 2); c.fill();
      c.fillStyle = P.sunCore2;
      c.beginPath(); c.arc(sunX - 5, sunY - 4, 24, 0, Math.PI * 2); c.fill();
    } else {
      // Sun Glow
      const sunGlow = rgrad(c, sunX, sunY, 10, sunX, sunY, 320, P.sunGlowStops);
      c.fillStyle = sunGlow;
      c.beginPath(); c.arc(sunX, sunY, 320, 0, Math.PI * 2); c.fill();

      // Sun Core Disk
      c.fillStyle = P.sunCore1;
      c.beginPath(); c.arc(sunX, sunY, 28, 0, Math.PI * 2); c.fill();
      c.fillStyle = P.sunCore2;
      c.beginPath(); c.arc(sunX, sunY, 42, 0, Math.PI * 2); c.fill();
    }

    // 3. Sun Shafts / Light Beams
    if (false && P.beamAlphaMult > 0) { // r27: sun beams removed (rays-over-clouds flags g23,g26)
      c.save();
      c.globalCompositeOperation = 'lighter';
      const numBeams = 5;
      for (let i = 0; i < numBeams; i++) {
        const angle = P.beamBaseAngle + i * P.beamAngleStep + Math.sin(t * 0.5 + i) * 0.01;
        const alpha = (0.12 + Math.sin(t * 1.5 + i * 2) * 0.03) * P.beamAlphaMult;

        c.fillStyle = lgrad(c, sunX, sunY, sunX + Math.cos(angle) * 1600, sunY + Math.sin(angle) * 1600, P.beamStops(alpha));

        c.beginPath();
        c.moveTo(sunX, sunY);
        c.lineTo(sunX + Math.cos(angle - 0.06) * 1800, sunY + Math.sin(angle - 0.06) * 1800);
        c.lineTo(sunX + Math.cos(angle + 0.06) * 1800, sunY + Math.sin(angle + 0.06) * 1800);
        c.closePath();
        c.fill();
      }
      c.restore();
    }

    // 4. Drifting Clouds
    const cloudList = [
      { x: 100, y: 120, scale: 1.2, speed: 12 },
      { x: 650, y: 80, scale: 0.9, speed: 9 },
      { x: 1200, y: 160, scale: 1.4, speed: 15 },
      { x: 1680, y: 100, scale: 1.0, speed: 11 }
    ];

    cloudList.forEach((cl, idx) => {
      let cx = ((cl.x + t * cl.speed) % 2300) - 200;
      let cy = cl.y + Math.sin(t * 0.8 + idx) * 6;
      let sc = cl.scale;

      c.save();
      c.translate(cx, cy);
      c.scale(sc, sc);

      const cloudG = lgrad(c, 0, -40, 0, 40, P.cloudStops);
      c.fillStyle = cloudG;

      c.beginPath();
      // r21: moveTo before each arc (connecting chords made a sharp straight cut line, g20)
      [[0,10,45],[40,-10,35],[-40,0,32],[75,12,25],[-75,15,22]].forEach(([ax,ay,ar])=>{c.moveTo(ax+ar,ay);c.arc(ax,ay,ar,0,Math.PI*2);});
      c.closePath();
      c.fill();
      c.restore();
    });

    // 5. River Water Band (behind skyline)
    const riverY = horizonY - 45;
    const riverH = 45;
    const riverG = lgrad(c, 0, riverY, 0, horizonY, P.riverStops);
    c.fillStyle = riverG;
    c.fillRect(0, riverY, 1920, riverH);

    // River Water Ripples
    c.strokeStyle = P.riverRipples;
    c.lineWidth = 2;
    for (let r = 0; r < 6; r++) {
      let ry = riverY + 8 + r * 6;
      let wave = Math.sin(t * 3 + r * 1.5) * 8;
      c.beginPath();
      c.moveTo(200 + wave, ry);
      c.lineTo(600 + wave, ry);
      c.moveTo(850 - wave, ry + 2);
      c.lineTo(1350 - wave, ry + 2);
      c.stroke();
    }

    // 6. Distant Suspension Bridge spanning river
    const bBridgeY = riverY + 12;
    c.fillStyle = P.bridgeDeck;
    c.fillRect(100, bBridgeY, 1720, 6);

    [450, 1350].forEach(tx => {
      c.fillStyle = lgrad(c, tx - 10, bBridgeY - 60, tx + 10, bBridgeY, P.bridgeTowerStops);
      c.fillRect(tx - 8, bBridgeY - 60, 16, 60);

      c.strokeStyle = P.bridgeCables;
      c.lineWidth = 1.5;
      c.beginPath();
      c.moveTo(tx - 250, bBridgeY);
      c.quadraticCurveTo(tx, bBridgeY - 55, tx + 250, bBridgeY);
      c.stroke();
    });

    // Moving traffic on bridge
    for (let i = 0; i < 10; i++) {
      let carX1 = ((t * 45 + i * 160) % 1700) + 100;
      let carX2 = 1800 - ((t * 55 + i * 180) % 1700);

      c.fillStyle = P.carHeadlight;
      c.fillRect(carX1, bBridgeY - 3, 4, 2);

      c.fillStyle = P.carTaillight;
      c.fillRect(carX2, bBridgeY - 3, 4, 2);
    }

    // 7. City Skyline Skyscrapers
    const rearBuildings = [
      { x: 50, w: 110, h: 220 },
      { x: 220, w: 90, h: 180 },
      { x: 340, w: 140, h: 260 },
      { x: 700, w: 120, h: 200 },
      { x: 860, w: 160, h: 300 },
      { x: 1060, w: 100, h: 210 },
      { x: 1400, w: 130, h: 250 },
      { x: 1600, w: 150, h: 230 }
    ];

    rearBuildings.forEach(b => {
      let by = riverY - b.h;
      c.fillStyle = lgrad(c, b.x, by, b.x + b.w, riverY, P.rearBuildingStops);
      c.fillRect(b.x, by, b.w, b.h + 10);
    });

    const frontBuildings = [
      { x: 0, w: 90, h: 160 },
      { x: 120, w: 130, h: 240, spire: true },
      { x: 480, w: 150, h: 280, spire: true },
      { x: 650, w: 100, h: 190 },
      { x: 980, w: 140, h: 340, spire: true },
      { x: 1150, w: 120, h: 230 },
      { x: 1300, w: 110, h: 290 },
      { x: 1520, w: 140, h: 210 },
      { x: 1720, w: 160, h: 270, spire: true }
    ];

    frontBuildings.forEach((b, idx) => {
      let by = riverY - b.h;

      c.fillStyle = lgrad(c, b.x, by, b.x + b.w, riverY, P.frontBuildingStops);
      c.fillRect(b.x, by, b.w, b.h + 10);

      c.fillStyle = P.buildingEdgeHighlight;
      c.fillRect(b.x, by, 4, b.h);

      if (P.windowsOn) {
        c.fillStyle = P.windowColor;
        for (let wx = b.x + 12; wx < b.x + b.w - 15; wx += 20) {
          for (let wy = by + 20; wy < riverY - 20; wy += 28) {
            if ((wx * 7 + wy * 13 + idx) % 5 > 1) {
              c.fillRect(wx, wy, 8, 12);
            }
          }
        }
      }

      if (b.spire) {
        let spireX = b.x + b.w / 2;
        c.fillStyle = P.spireColor;
        c.fillRect(spireX - 2, by - 35, 4, 35);

        let blink = Math.sin(t * 4 + idx) > 0;
        if (blink) {
          c.fillStyle = '#ff3333';
          c.beginPath(); c.arc(spireX, by - 36, 4, 0, Math.PI * 2); c.fill();
          c.fillStyle = 'rgba(255, 50, 50, 0.4)';
          c.beginPath(); c.arc(spireX, by - 36, 10, 0, Math.PI * 2); c.fill();
        }
      }
    });

    // 8. Soaring Birds / Pigeons in sky
    for (let i = 0; i < 5; i++) {
      let bx = ((t * 45 + i * 180) % 2100) - 100;
      let by = 180 + Math.sin(t * 1.5 + i) * 25 + i * 20;
      let flap = Math.sin(t * 12 + i) * 6;

      c.strokeStyle = P.birdColor;
      c.lineWidth = 2.5;
      c.beginPath();
      c.moveTo(bx - 10, by + flap);
      c.quadraticCurveTo(bx - 5, by - 6, bx, by);
      c.quadraticCurveTo(bx + 5, by - 6, bx + 10, by + flap);
      c.stroke();
    }

    c.restore();
  }

  // --- MID DRAWING (Roof Surface, Parapet, Fence, Water Tank, AC, Hoop, Bench, Props) ---
  function drawMID(c, t, view, P) {
    c.save();

    if (view === 'top') {
      const cx = 960, cy = 540;

      const roofG = lgrad(c, 0, 0, 1920, 1080, P.topRoofGStops);
      c.fillStyle = roofG;
      c.fillRect(0, 0, 1920, 1080);

      c.strokeStyle = 'rgba(0, 0, 0, 0.15)';
      c.lineWidth = 2;
      for (let x = 0; x < 1920; x += 240) {
        c.beginPath(); c.moveTo(x, 0); c.lineTo(x, 1080); c.stroke();
      }
      for (let y = 0; y < 1080; y += 240) {
        c.beginPath(); c.moveTo(0, y); c.lineTo(1920, y); c.stroke();
      }

      c.fillStyle = P.parapetWallStops[0][1];
      c.fillRect(0, 120, 1920, 30);
      c.fillStyle = P.parapetCapStops[0][1];
      c.fillRect(0, 115, 1920, 10);

      c.fillStyle = P.topShadowColor;
      c.beginPath();
      c.ellipse(450, 480, 160, 120, 0.5, 0, Math.PI * 2);
      c.fill();
      c.beginPath();
      c.moveTo(1500, 540);
      c.lineTo(1800, 750);
      c.lineTo(1760, 780);
      c.lineTo(1460, 570);
      c.closePath();
      c.fill();

      c.strokeStyle = '#f5eedc';
      c.lineWidth = 10;
      c.beginPath(); c.arc(cx - 200, cy, 180, 0, Math.PI * 2); c.stroke();
      c.strokeStyle = '#ffc83b';
      c.strokeRect(1100, 300, 480, 480);
      c.fillStyle = 'rgba(255, 200, 60, 0.12)';
      c.fillRect(1100, 300, 480, 480);
      c.strokeStyle = '#f5eedc';
      c.beginPath(); c.arc(1100, 540, 180, -Math.PI / 2, Math.PI / 2); c.stroke();
      c.beginPath(); c.arc(1580, 540, 440, Math.PI * 0.65, Math.PI * 1.35); c.stroke();

      c.fillStyle = rgrad(c, 300, 280, 10, 300, 280, 140, P.wtRoofStops);
      c.beginPath(); c.arc(300, 280, 140, 0, Math.PI * 2); c.fill();
      c.fillStyle = P.wtSpireColor;
      c.beginPath(); c.arc(300, 280, 14, 0, Math.PI * 2); c.fill();

      c.strokeStyle = P.backboardFrame;
      c.lineWidth = 14;
      c.beginPath(); c.moveTo(1580, 420); c.lineTo(1580, 660); c.stroke();
      c.strokeStyle = P.rimColor;
      c.lineWidth = 8;
      c.beginPath(); c.arc(1530, 540, 45, 0, Math.PI * 2); c.stroke();
      let netSwayX = Math.sin(t * 2.8) * 8;
      let netSwayY = Math.cos(t * 2.2) * 5;
      c.strokeStyle = P.netColor;
      c.lineWidth = 3;
      c.beginPath(); c.arc(1530 + netSwayX, 540 + netSwayY, 35, 0, Math.PI * 2); c.stroke();

      c.restore();
      return;
    }

    const isLow = (view === 'low');
    const roofY = isLow ? 700 : 530;
    const roofH = 1080 - roofY;

    // 1. Parapet Brick Wall
    const wallY = roofY - (isLow ? 50 : 40);
    const wallH = isLow ? 50 : 40;

    c.fillStyle = lgrad(c, 0, wallY, 0, wallY + wallH, P.parapetWallStops);
    c.fillRect(0, wallY, 1920, wallH);

    c.fillStyle = lgrad(c, 0, wallY - 8, 0, wallY, P.parapetCapStops);
    c.fillRect(0, wallY - 8, 1920, 8);

    c.strokeStyle = 'rgba(0, 0, 0, 0.25)';
    c.lineWidth = 1.5;
    for (let bx = 0; bx < 1920; bx += 40) {
      c.beginPath(); c.moveTo(bx, wallY); c.lineTo(bx, wallY + wallH); c.stroke();
    }

    // 2. Rooftop Deck Surface
    const deckG = lgrad(c, 0, roofY, 1920, 1080, P.deckStops);
    c.fillStyle = deckG;
    c.fillRect(0, roofY, 1920, roofH);

    c.strokeStyle = 'rgba(0, 0, 0, 0.2)';
    c.lineWidth = 2;
    for (let px = 0; px < 1920; px += 320) {
      c.beginPath();
      c.moveTo(px, roofY);
      c.lineTo(px - 100, 1080);
      c.stroke();
    }

    // 3. Contact Shadows on Deck: attached to each object base, one sun (morning, from the left -> soft short shadows to the right)
    {
      const _wy = (typeof wallY!=='undefined')?wallY:roofY-60;
      const sh=(x,y,rx,ry,a)=>{c.save();c.globalAlpha=Math.min(1,a*1.5);c.fillStyle='rgba(8,6,14,0.62)';c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill();c.restore();};
      const wtX = isLow ? 180 : 220, wtW = isLow ? 240 : 190;
      // r22: water-tower shadow removed (tower gone since r21; g21 'floating shadow oval left')
      const acX = isLow ? 600 : 540, acW = isLow ? 180 : 140;
      sh(acX+acW/2+18, _wy+4, acW*0.58, isLow?10:7, .45);
      const hoopX = isLow ? 1220 : 1520;
      /* r25: hoop deck shadow REMOVED (3-round rule g22/g24 offset) */ // r22: centered on pole foot (hoopX+135, roofY+120)
      const benchX = isLow ? 300 : 320, benchY = roofY + (isLow ? 160 : 100);
      sh(benchX+150, benchY+50, 162, isLow?12:9, .5);
      sh(benchX+143, benchY+48, 124, isLow?7:5, .45); // darker core so the bench reads grounded
    }

    // 4. Painted Court Lines
    c.strokeStyle = '#f0ebd8';
    c.lineWidth = isLow ? 12 : 8;

    if (isLow) {
      c.beginPath(); c.moveTo(0, 920); c.lineTo(1920, 920); c.stroke();
      c.strokeStyle = '#ffc83b';
      c.beginPath();
      c.moveTo(600, 920); c.lineTo(750, 700);
      c.lineTo(1250, 700); c.lineTo(1400, 920);
      c.stroke();
      c.fillStyle = 'rgba(255, 200, 60, 0.1)';
      c.fill();
      c.strokeStyle = '#f0ebd8'; c.beginPath(); c.moveTo(0, 920); c.lineTo(1920, 920); c.stroke(); // r31: yellow key ends UNDER white baseline (g30 intersection glitch)

      c.strokeStyle = '#f0ebd8';
      c.beginPath();
      c.ellipse(1000, 700, 250, 92, 0, 0, Math.PI); // r4: lower half on the floor (upper half went past roof edge y700 into the fence)
      c.stroke();
    } else {
      // one-point eye-level perspective: every court line lies on the same floor plane
      const HOR = roofY - 90, VX = 960;
      const X = (xb, yb, y) => VX + (xb - VX) * (y - HOR) / (yb - HOR); // slide a back-row point forward along its ray
      const yB = roofY + 70, yF = 1080;
      c.lineCap = 'round';
      // baseline (parallel to picture plane) + two sidelines converging to the VP
      c.beginPath(); c.moveTo(X(260, yB, yB), yB); c.lineTo(X(1820, yB, yB), yB); c.stroke();
      c.beginPath(); c.moveTo(260, yB); c.lineTo(X(260, yB, yF), yF); c.stroke();
      c.beginPath(); c.moveTo(1820, yB); c.lineTo(X(1820, yB, yF), yF); c.stroke();
      // key under the hoop (trapezoid widening toward camera) + free-throw line
      const kL = 1540, kR = 1760, yK = roofY + 210;
      c.strokeStyle = '#ffc83b'; c.fillStyle = 'rgba(255, 200, 60, 0.12)';
      c.beginPath(); c.moveTo(kL, yB); c.lineTo(kR, yB); c.lineTo(X(kR, yB, yK), yK); c.lineTo(X(kL, yB, yK), yK); c.closePath(); c.fill(); c.stroke();
      c.strokeStyle = '#f0ebd8'; c.lineCap = 'butt'; c.beginPath(); c.moveTo(X(260, yB, yB) - 4, yB); c.lineTo(X(1820, yB, yB) + 4, yB); c.stroke(); c.lineCap = 'round'; // r31: baseline over key ends (g30)
      // centre circle: squash grows with distance below the horizon (same plane)
      c.strokeStyle = '#f0ebd8';
      const yC = roofY + 300, rC = 150 * (yC - HOR) / (yB - HOR) * 0.55, sqC = (yC - HOR) / 900;
      c.beginPath(); c.ellipse(VX - 120, yC, rC, rC * sqC, 0, 0, Math.PI * 2); c.stroke();
      // half-court line through the circle, parallel to the baseline
      c.beginPath(); c.moveTo(X(260, yB, yC), yC); c.lineTo(X(1820, yB, yC), yC); c.stroke();
    }

    // 5. Chain-Link Fence
    const fenceTopY = isLow ? wallY - 320 : wallY - 220;
    const fenceBotY = wallY - 4;

    const postXList = [50, 360, 680, 1000, 1320, 1640, 1900];
    postXList.forEach(px => {
      c.fillStyle = lgrad(c, px - 5, fenceTopY, px + 5, fenceBotY, P.fencePostStops);
      c.fillRect(px - 5, fenceTopY - 10, 10, fenceBotY - fenceTopY + 10);
      c.fillStyle = P.fenceCapColor;
      c.beginPath(); c.arc(px, fenceTopY - 12, 7, 0, Math.PI * 2); c.fill();
    });

    c.fillStyle = lgrad(c, 0, fenceTopY, 0, fenceTopY + 8, P.fenceRailStops);
    c.fillRect(0, fenceTopY, 1920, 8);
    c.fillRect(0, fenceBotY - 4, 1920, 6);

    if (false) { // r27 SIMPLIFY: fence mesh removed (fence-over-crowd flags g18-g26)
    c.strokeStyle = P.fenceMeshColor;
    c.lineWidth = 1.2;
    const meshStep = 28;
    for (let x = -400; x < 2200; x += meshStep) {
      c.beginPath();
      c.moveTo(x, fenceTopY);
      c.lineTo(x + (fenceBotY - fenceTopY), fenceBotY);
      c.stroke();

      c.beginPath();
      c.moveTo(x, fenceTopY);
      c.lineTo(x - (fenceBotY - fenceTopY), fenceBotY);
      c.stroke();
    }
    }

    if (false) { // r21 SIMPLIFY: pennant flag + water tower/ladder removed (flip-flop flags g13-g20)
    // Flapping Pennant Flag
    const flagPostX = 1640;
    const flagY = fenceTopY - 5;
    let flagWave = Math.sin(t * 7) * 12;
    let flagWave2 = Math.cos(t * 8) * 8;

    c.fillStyle = lgrad(c, flagPostX, flagY, flagPostX + 70, flagY + 40, P.flagStops);
    c.beginPath();
    c.moveTo(flagPostX, flagY);
    c.quadraticCurveTo(flagPostX + 35, flagY + flagWave * 0.5, flagPostX + 70, flagY + 15 + flagWave);
    c.quadraticCurveTo(flagPostX + 35, flagY + 35 + flagWave2, flagPostX, flagY + 40);
    c.closePath();
    c.fill();

    // 6. Wooden Rooftop Water Tank
    const wtX = isLow ? 180 : 220;
    const wtW = isLow ? 240 : 190;
    const wtH = isLow ? 280 : 210;
    const wtY = isLow ? wallY - 380 : wallY - 250;

    // contact shadows under water-tower legs (EP02 r8)
    c.save(); c.fillStyle = 'rgba(0,0,0,0.6)';
    [wtX - 20, wtX + wtW / 2, wtX + wtW + 20].forEach(lx => { c.beginPath(); c.ellipse(lx+4, roofY + 61, isLow ? 30 : 22, isLow ? 8 : 6, 0, 0, Math.PI * 2); c.fill(); });
    c.restore();
    c.strokeStyle = P.wtLegsColor;
    c.lineWidth = isLow ? 10 : 7;
    c.beginPath();
    c.moveTo(wtX + 30, wtY + wtH); c.lineTo(wtX - 20, roofY + 60);
    c.moveTo(wtX + wtW - 30, wtY + wtH); c.lineTo(wtX + wtW + 20, roofY + 60);
    c.moveTo(wtX + wtW / 2, wtY + wtH); c.lineTo(wtX + wtW / 2, roofY + 60);
    c.stroke();

    c.lineWidth = 3.5;
    c.strokeStyle = P.wtBracesColor;
    c.beginPath();
    c.moveTo(wtX - 10, wtY + wtH + 30); c.lineTo(wtX + wtW + 10, roofY + 30);
    c.moveTo(wtX + wtW + 10, wtY + wtH + 30); c.lineTo(wtX - 10, roofY + 30);
    c.stroke();

    const barrelG = lgrad(c, wtX, wtY, wtX + wtW, wtY, P.wtBarrelStops);
    c.fillStyle = barrelG;
    rrect(c, wtX, wtY, wtW, wtH, 12);
    c.fill();

    c.strokeStyle = 'rgba(0, 0, 0, 0.3)';
    c.lineWidth = 2;
    for (let sx = wtX + 20; sx < wtX + wtW; sx += 22) {
      c.beginPath(); c.moveTo(sx, wtY); c.lineTo(sx, wtY + wtH); c.stroke();
    }

    const bandYs = [wtY + wtH * 0.2, wtY + wtH * 0.5, wtY + wtH * 0.8];
    bandYs.forEach(by => {
      c.fillStyle = lgrad(c, wtX, by, wtX + wtW, by + 6, P.wtBandStops);
      c.fillRect(wtX - 3, by, wtW + 6, 6);
    });

    const roofConeH = isLow ? 85 : 65;
    c.fillStyle = lgrad(c, wtX - 15, wtY - roofConeH, wtX + wtW + 15, wtY, P.wtRoofStops);
    c.beginPath();
    c.moveTo(wtX + wtW / 2, wtY - roofConeH);
    c.lineTo(wtX + wtW + 15, wtY);
    c.lineTo(wtX - 15, wtY);
    c.closePath();
    c.fill();

    c.fillStyle = P.wtSpireColor;
    c.beginPath(); c.arc(wtX + wtW / 2, wtY - roofConeH - 6, 7, 0, Math.PI * 2); c.fill();

    c.strokeStyle = P.wtLadderColor;
    c.lineWidth = 3;
    c.beginPath();
    c.moveTo(wtX + 25, wtY + 4); c.lineTo(wtX + 25, roofY + 56);
    c.moveTo(wtX + 42, wtY + 4); c.lineTo(wtX + 42, roofY + 56);
    c.stroke();
    for (let ly = wtY + 12; ly < roofY + 52; ly += 18) { // r14: even rungs, none at rail tips
      c.beginPath(); c.moveTo(wtX + 25, ly); c.lineTo(wtX + 42, ly); c.stroke();
    }
    // r16: catwalk at barrel bottom (ladder joins a platform) + rail foot plates on roof
    c.fillStyle = P.wtLadderColor;
    c.fillRect(wtX - 14, wtY + wtH - 2, wtW + 28, 6);
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(wtX - 14, wtY + wtH - 22); c.lineTo(wtX + wtW + 14, wtY + wtH - 22);
    for (let px = wtX - 14; px <= wtX + wtW + 14; px += (wtW + 28) / 6) { c.moveTo(px, wtY + wtH - 22); c.lineTo(px, wtY + wtH); }
    c.stroke();
    c.fillRect(wtX + 20, roofY + 54, 10, 4); c.fillRect(wtX + 37, roofY + 54, 10, 4);
    c.lineWidth = 3;

    }
    // 7. Industrial AC / HVAC Units
    const acX = isLow ? 600 : 540;
    const acY = isLow ? wallY - 110 : wallY - 80; // r6: base sits ON parapet cap (no float)
    const acW = isLow ? 180 : 140;
    const acH = isLow ? 110 : 80;

    c.save(); c.fillStyle='rgba(0,0,0,0.45)'; c.beginPath(); c.ellipse(acX+acW/2+6, acY+acH+2, acW*0.56, 7, 0, 0, Math.PI*2); c.fill(); c.fillStyle='rgba(0,0,0,0.6)'; c.fillRect(acX+4, acY+acH-3, acW-8, 5); c.restore(); // r31 AC contact shadow on cap (g30)
    c.fillStyle = lgrad(c, acX, acY, acX + acW, acY + acH, P.acBodyStops);
    rrect(c, acX, acY, acW, acH, 8);
    c.fill();

    c.fillStyle = P.acLouverColor;
    for (let ly = acY + 15; ly < acY + acH - 15; ly += 12) {
      c.fillRect(acX + 15, ly, acW * 0.4, 4);
    }

    const fanCx = acX + acW * 0.75;
    const fanCy = acY + acH * 0.5;
    const fanR = acH * 0.32;

    c.fillStyle = P.acFanHousingColor;
    c.beginPath(); c.arc(fanCx, fanCy, fanR, 0, Math.PI * 2); c.fill();
    c.strokeStyle = P.acFanRimColor;
    c.lineWidth = 3;
    c.stroke();

    c.save();
    c.translate(fanCx, fanCy);
    // r31: static symmetric grille (rotating blades read as off-centre/uneven)
    c.strokeStyle = P.acFanBladeColor; c.lineWidth = 2;
    [0.35, 0.65, 0.9].forEach(k => { c.beginPath(); c.arc(0, 0, fanR * k, 0, Math.PI * 2); c.stroke(); });
    c.beginPath(); c.moveTo(-fanR * 0.9, 0); c.lineTo(fanR * 0.9, 0); c.moveTo(0, -fanR * 0.9); c.lineTo(0, fanR * 0.9); c.stroke();
    c.fillStyle = P.acFanRimColor; c.beginPath(); c.arc(0, 0, fanR * 0.12, 0, Math.PI * 2); c.fill();
    c.restore();

    c.strokeStyle = P.acPipeColor;
    c.lineWidth = 6;
    c.beginPath();
    c.moveTo(acX + acW, acY + acH * 0.7);
    c.lineTo(acX + acW + 40, acY + acH * 0.7);
    c.lineTo(acX + acW + 40, wallY + 4); // r6: pipe enters parapet top, not over fence

  // --- Main Set Entry Point ---
  window.SET_DINER = function(c, t, o) {
    o = o || {};
    const layer = o.layer || 'all';
    const view = o.view || 'wide';
    const grey = typeof o.grey === 'number' ? o.grey : 0;
    const bgBlur = o.bgBlur || 0;
    const fgBlur = o.fgBlur || 0;

    const tod = (o.tod && PALETTES[o.tod]) ? o.tod : 'sunset';
    const P = PALETTES[tod];

    c.save();

    // Apply grayscale filter if o.grey > 0
    if (grey > 0) {
      c.filter = `grayscale(${Math.min(100, Math.max(0, grey * 100))}%)`;
    }

    if (view === 'tablecu') {
      drawTableCU(c, t, layer, bgBlur, fgBlur, P);
    } else if (view === 'window') {
      drawWindowView(c, t, layer, bgBlur, fgBlur, P);
    } else {
      drawWideView(c, t, layer, bgBlur, fgBlur, P);
    }

    c.restore();
  };

  // =========================================================================
  // VIEW 1: WIDE VIEW (Default)
  // =========================================================================
  function drawWideView(c, t, layer, bgBlur, fgBlur, P) {
    if (layer === 'all' || layer === 'bg') {
      c.save();
      if (bgBlur > 0) c.filter = `blur(${bgBlur}px)`;
      drawWideBG(c, t, P);
      c.restore();
    }

    if (layer === 'all' || layer === 'mid') {
      drawWideMid(c, t, P);
    }

    if (layer === 'all' || layer === 'fg') {
      c.save();
      if (fgBlur > 0) c.filter = `blur(${fgBlur}px)`;
      drawWideFG(c, t, P);
      c.restore();
    }
  }

  // --- Wide BG ---
  function drawWideBG(c, t, P) {
    // OUTSIDE (far layer) gets camera depth blur
    c.save();
    { const pf = (c.filter && c.filter !== 'none') ? c.filter + ' ' : ''; c.filter = pf + 'blur(3px)'; }
    // 1. Sky outside big glass wall (X: 800..1920, Y: 100..750)
    const skyG = linGrad(c, 0, 100, 0, 560, P.skyStops);
    c.fillStyle = skyG;
    c.fillRect(800, 100, 1120, 460);

    // Sun disk behind glass
    drawRadialGlow(c, P.sun.x, P.sun.y, P.sun.r, P.sun.glow);
    if (P.sun.disk) {
      c.fillStyle = P.sun.disk;
      c.beginPath();
      c.arc(P.sun.x, P.sun.y, 35, 0, Math.PI * 2);
      c.fill();
    }

    // Outside Street Skyline / Buildings
    c.fillStyle = linGrad(c, 0, 360, 0, 560, P.bldgStops);
    // Distant building silhouettes
    c.fillRect(820, 400, 140, 160);
    c.fillRect(990, 430, 110, 130);
    c.fillRect(1130, 380, 160, 180);
    c.fillRect(1320, 420, 120, 140);
    c.fillRect(1500, 390, 180, 170);
    c.fillRect(1710, 410, 190, 150);

    // Lit windows in background buildings
    c.fillStyle = P.bldgWinCol;
    c.globalAlpha = P.bldgWinAlpha;
    for (let i = 0; i < 6; i++) {
      c.fillRect(840 + i * 160, 420 + (i % 3) * 20, 14, 18);
      c.fillRect(870 + i * 160, 450, 14, 18);
    }
    c.globalAlpha = 1.0;

    // Sidewalk & Road outside
    const sidewalkG = linGrad(c, 0, 530, 0, 580, P.sidewalkStops);
    c.fillStyle = sidewalkG;
    c.fillRect(800, 530, 1120, 50);

    const roadG = linGrad(c, 0, 580, 0, 760, P.roadStops);
    c.fillStyle = roadG;
    c.fillRect(800, 580, 1120, 180);

    // Road markings (yellow dashed line)
    c.fillStyle = '#E5C04A';
    c.globalAlpha = 0.5;
    for (let x = 820; x < 1920; x += 120) {
      c.fillRect(x, 660, 60, 8);
    }
    c.globalAlpha = 1.0;

    // --- Animated Passing Cars & Pedestrians outside ---
    drawOutsideTraffic(c, t);
    c.restore();

    // Big Glass Window Frame & Panes (X: 800..1920, Y: 100..760)
    // Dark bronze aluminum window frame
    const frameG = linGrad(c, 0, 100, 0, 760, P.winFrameStops);
    c.fillStyle = frameG;
    c.fillRect(800, 90, 1120, 20);  // top transom
    c.fillRect(800, 750, 1120, 25); // bottom sill

    // Vertical frame mullions
    [800, 1150, 1500, 1880].forEach(x => {
      c.fillRect(x, 90, 24, 680);
      // Metallic highlight edge
      c.fillStyle = '#61524D';
      c.fillRect(x + 2, 90, 4, 680);
      c.fillStyle = frameG;
    });

    // Glass sheen / reflection diagonal streaks
    c.fillStyle = 'rgba(255, 255, 255, 0.07)';
    c.beginPath();
    c.moveTo(850, 110); c.lineTo(1100, 110); c.lineTo(950, 750); c.lineTo(820, 750);
    c.fill();
    c.beginPath();
    c.moveTo(1250, 110); c.lineTo(1520, 110); c.lineTo(1350, 750); c.lineTo(1180, 750);
    c.fill();

    // --- Diner Interior Walls & Structure ---
    // Upper Wall (X: 0..820, Y: 0..560)
    const wallG = linGrad(c, 0, 0, 0, 560, P.wallStops);
    c.fillStyle = wallG;
    c.fillRect(0, 0, 820, 560);

    // Ceilings (0..100 across full width)
    const ceilG = linGrad(c, 0, 0, 0, 100, [
      [0, '#211E1D'], [1, '#3B3533']
    ]);
    c.fillStyle = ceilG;
    c.fillRect(0, 0, 1920, 100);

    // Teal Ceramic Tile Wainscoting (X: 0..820, Y: 320..560)
    const tileG = linGrad(c, 0, 320, 0, 560, P.tileStops);
    c.fillStyle = tileG;
    c.fillRect(0, 320, 820, 240);

    // Tile grid lines & glossy sheen
    c.strokeStyle = 'rgba(255, 255, 255, 0.08)';
    c.lineWidth = 2;
    for (let x = 0; x < 820; x += 40) {
      c.beginPath(); c.moveTo(x, 320); c.lineTo(x, 560); c.stroke();
    }
    for (let y = 320; y < 560; y += 30) {
      c.beginPath(); c.moveTo(0, y); c.lineTo(820, y); c.stroke();
    }

    // Polished Wood / Brass Mold Trim (Y: 310..324)
    const trimG = linGrad(c, 0, 310, 0, 324, P.trimStops);
    c.fillStyle = trimG;
    c.fillRect(0, 310, 820, 14);

    // Floor: warm wood, starts under the counter wall (x<800) and under the window sill (x>=800)
    const floorG = linGrad(c, 0, 560, 0, 1080, P.floorStops);
    c.fillStyle = floorG;
    c.beginPath(); c.moveTo(0, 560); c.lineTo(812, 560); c.lineTo(812, 775); c.lineTo(1920, 775); c.lineTo(1920, 1080); c.lineTo(0, 1080); c.closePath(); c.fill();
    c.save(); c.clip();
    // perspective plank lines (vanishing toward the window)
    c.strokeStyle = 'rgba(60, 30, 12, 0.22)'; c.lineWidth = 2;
    for (let x = -400; x < 2400; x += 110) {
      c.beginPath(); c.moveTo(x, 560); c.lineTo(960 + (x - 960) * 1.7, 1080); c.stroke();
    }
    // board joints, spacing grows toward camera
    for (let i = 0, y = 600; y < 1080; i++, y += 22 + i * 9) {
      c.strokeStyle = 'rgba(60, 30, 12, 0.14)';
      c.beginPath(); c.moveTo(0, y); c.lineTo(1920, y); c.stroke();
    }
    // sun / light pools from the windows
    c.globalCompositeOperation = 'lighter';
    const pools = P.floorPools || [[900, 1180, 640, 1000], [1240, 1520, 1000, 1400], [1560, 1880, 1380, 1800]];
    pools.forEach(([a, b, d, e]) => {
      const g = linGrad(c, 0, 775, 0, 1080, P.floorPoolStops);
      c.fillStyle = g; c.beginPath(); c.moveTo(a, 775); c.lineTo(b, 775); c.lineTo(e, 1080); c.lineTo(d, 1080); c.closePath(); c.fill();
    });
    c.globalCompositeOperation = 'source-over';
    // soft glossy reflection of the window on the floor
    c.fillStyle = P.floorReflectCol; c.fillRect(812, 778, 1108, 40);
    c.restore();
    // baseboard under the left wall
    c.fillStyle = '#3A2416'; c.fillRect(0, 552, 812, 10);

    // --- Pass Window / Kitchen Opening (X: 180..500, Y: 200..380) ---
    drawPassWindow(c, t, P);

    // --- Menu Board (X: 530..770, Y: 130..360) ---
    drawMenuBoard(c);

    // --- Wall Clock (X: 100, Y: 150) ---
    drawWallClock(c, t);

    // --- Wall Plant / Shelf (X: 50..230, Y: 270) ---
    drawWallShelf(c);
  }

  // --- Animated Outside Traffic ---
  function drawOutsideTraffic(c, t) {
    c.save();

    // Car 1: Red sedan moving left-to-right
    const car1X = -200 + ((t * 210) % 1500);
    const car1Y = 620;
    // Car shadow
    c.fillStyle = 'rgba(0, 0, 0, 0.35)';
    drawRR(c, car1X - 10, car1Y + 35, 220, 20, 10); c.fill();
    // Car body gradient
    c.fillStyle = linGrad(c, 0, car1Y, 0, car1Y + 40, [
      [0, '#E53935'], [0.5, '#C62828'], [1, '#8E0000']
    ]);
    drawRR(c, car1X, car1Y + 15, 200, 30, 8); c.fill();
    // Roof
    drawRR(c, car1X + 40, car1Y, 110, 20, 6); c.fill();
    // Car windows
    c.fillStyle = '#A1D4F7';
    c.fillRect(car1X + 50, car1Y + 3, 40, 12);
    c.fillRect(car1X + 95, car1Y + 3, 45, 12);
    // Headlight glow
    drawRadialGlow(c, car1X + 200, car1Y + 25, 40, 'rgba(255, 235, 150, 0.6)');

    // Car 2: Teal vintage cruiser moving right-to-left
    const car2X = 2000 - ((t * 180) % 1600);
    const car2Y = 600;
    c.fillStyle = 'rgba(0, 0, 0, 0.35)';
    drawRR(c, car2X - 10, car2Y + 35, 240, 20, 10); c.fill();
    c.fillStyle = linGrad(c, 0, car2Y, 0, car2Y + 40, [
      [0, '#26A69A'], [0.5, '#00897B'], [1, '#004D40']
    ]);
    drawRR(c, car2X, car2Y + 15, 220, 30, 8); c.fill();
    drawRR(c, car2X + 50, car2Y, 120, 20, 6); c.fill();
    c.fillStyle = '#E0F7FA';
    c.fillRect(car2X + 60, car2Y + 3, 45, 12);
    c.fillRect(car2X + 110, car2Y + 3, 50, 12);

    // Pedestrian Silhouette walking on sidewalk
    const pedX = 850 + ((t * 45) % 1000);
    const pedY = 540;
    c.fillStyle = '#263238';
    c.beginPath(); c.arc(pedX, pedY - 35, 7, 0, Math.PI * 2); c.fill(); // head
    c.fillRect(pedX - 5, pedY - 28, 10, 20); // body
    // Legs
    const legPhase = Math.sin(t * 10) * 12;
    c.strokeStyle = '#263238'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(pedX - 2, pedY - 8); c.lineTo(pedX - 2 + legPhase, pedY + 10); c.stroke();
    c.beginPath(); c.moveTo(pedX + 2, pedY - 8); c.lineTo(pedX + 2 - legPhase, pedY + 10); c.stroke();

    c.restore();
  }

  // --- Pass Window & Cook Silhouette ---
  function drawPassWindow(c, t, P) {
    c.save();
    const px = 180, py = 200, pw = 320, ph = 180;

    // Stainless steel frame
    const frameG = linGrad(c, px, py, px + pw, py + ph, [
      [0, '#90A4AE'], [0.5, '#CFD8DC'], [1, '#546E7A']
    ]);
    c.fillStyle = frameG;
    drawRR(c, px - 12, py - 12, pw + 24, ph + 24, 8); c.fill();

    // Kitchen Interior Glow
    const kitchG = linGrad(c, px, py, px, py + ph, P.kitchStops);
    c.fillStyle = kitchG;
    c.fillRect(px, py, pw, ph);

    // Kitchen shelf & hanging order tickets
    c.fillStyle = '#37474F';
    c.fillRect(px, py + 10, pw, 8); // rail
    for (let i = 0; i < 5; i++) {
      c.fillStyle = '#FFF8E1';
      c.fillRect(px + 30 + i * 58, py + 18, 22, 35 + (i % 3) * 8);
      c.fillStyle = '#FF5252';
      c.fillRect(px + 30 + i * 58, py + 18, 22, 4); // red ticket top
    }

    // --- Animated Cook Silhouette ---
    const cookX = px + 150 + Math.sin(t * 1.2) * 35;
    const cookY = py + ph;
    const panLift = Math.abs(Math.sin(t * 3.2)) * 14;

    c.fillStyle = '#1C1B24'; // dark silhouette
    // Cook body/apron
    c.fillRect(cookX - 30, cookY - 95, 60, 95);
    // Cook head & chef toque hat
    c.beginPath(); c.arc(cookX, cookY - 110, 18, 0, Math.PI * 2); c.fill();
    drawRR(c, cookX - 16, cookY - 150, 32, 40, 6); c.fill(); // chef hat
    // Arms & frying pan
    c.fillRect(cookX + 15, cookY - 70 - panLift * 0.5, 30, 10);
    // Pan
    c.beginPath(); c.ellipse(cookX + 55, cookY - 65 - panLift, 22, 8, 0, 0, Math.PI * 2); c.fill();

    // Cook's pan steam
    for (let i = 0; i < 3; i++) {
      const stY = cookY - 75 - panLift - (t * 30 + i * 20) % 50;
      const stX = cookX + 55 + Math.sin(t * 3 + i) * 8;
      c.fillStyle = `rgba(255, 255, 255, ${0.35 - (cookY - 75 - stY) / 100})`;
      c.beginPath(); c.arc(stX, stY, 6 + i * 3, 0, Math.PI * 2); c.fill();
    }

    // Pass Stainless Counter Shelf & Food Plates
    const passShelfG = linGrad(c, px, py + ph - 22, px, py + ph, [
      [0, '#ECEFF1'], [0.5, '#B0BEC5'], [1, '#607D8B']
    ]);
    c.fillStyle = passShelfG;
    c.fillRect(px - 6, py + ph - 22, pw + 12, 22);

    // Food on pass: Stack of Pancakes + syrup
    c.fillStyle = '#FFF';
    c.beginPath(); c.ellipse(px + 60, py + ph - 16, 24, 7, 0, 0, Math.PI * 2); c.fill(); // plate
    c.fillStyle = '#D7CCC8';
    c.fillRect(px + 45, py + ph - 28, 30, 12); // pancake stack
    c.fillStyle = '#FFC107'; // butter square
    c.fillRect(px + 56, py + ph - 32, 8, 5);

    c.restore();
  }

  // --- Wall Clock ---
  function drawWallClock(c, t) {
    c.save();
    const cx = 100, cy = 150, r = 40;

    // Outer Chrome Ring
    c.fillStyle = linGrad(c, cx - r, cy - r, cx + r, cy + r, [
      [0, '#ECEFF1'], [0.5, '#78909C'], [1, '#37474F']
    ]);
    c.beginPath(); c.arc(cx, cy, r + 6, 0, Math.PI * 2); c.fill();

    // Cream Face
    c.fillStyle = '#FFFDE7';
    c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.fill();

    // Hour Ticks
    c.fillStyle = '#263238';
    for (let a = 0; a < 12; a++) {
      const ang = a * Math.PI / 6;
      const tx = cx + Math.cos(ang) * (r - 6);
      const ty = cy + Math.sin(ang) * (r - 6);
      c.beginPath(); c.arc(tx, ty, 2, 0, Math.PI * 2); c.fill();
    }

    // Hands: 7:15 + ticking second hand
    const secAng = (t * 2 * Math.PI / 60) - Math.PI / 2; // smooth second hand
    const minAng = (15 * Math.PI / 30) - Math.PI / 2;
    const hrAng = (7.25 * Math.PI / 6) - Math.PI / 2;

    // Hour Hand
    c.strokeStyle = '#263238'; c.lineWidth = 4; c.lineCap = 'round';
    c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(hrAng) * (r * 0.5), cy + Math.sin(hrAng) * (r * 0.5)); c.stroke();
    // Minute Hand
    c.lineWidth = 3;
    c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(minAng) * (r * 0.75), cy + Math.sin(minAng) * (r * 0.75)); c.stroke();
    // Second Hand (Red)
    c.strokeStyle = '#E53935'; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(secAng) * (r * 0.85), cy + Math.sin(secAng) * (r * 0.85)); c.stroke();

    // Center Cap
    c.fillStyle = '#D32F2F';
    c.beginPath(); c.arc(cx, cy, 3.5, 0, Math.PI * 2); c.fill();

    c.restore();
  }

  // --- Wide MID Layer ---
  function drawWideMid(c, t, P) {
    c.save();

    // 1. Sun Shafts & Dust Motes (streaming from camera-right glass windows)
    drawSunShafts(c, t, P);

    // 2. Main Diner Counter (X: 60..780, Y: 560..760)
    drawDinerCounter(c, t, P);

    // 3. Hanging Pendant Lamps swaying (3 lamps at X: 280, 700, 1120)
    drawPendantLamps(c, t, P);

    // 4. Foreground Table near right edge with Glass of Orange Juice (`DINER_GLASS`)
    drawForegroundTable(c, t, P);

    c.restore();
  }

  // --- Sun Shafts & Dust Motes ---
  function drawSunShafts(c, t, P) {
    c.save();

    const beamG = linGrad(c, 1600, 100, 900, 950, P.shaftStops);
    c.fillStyle = beamG;

    // Beam quads
    const quads = P.shaftQuads || [[1200, 1800, 600, 1400], [1450, 1920, 850, 1650], [1050, 1550, 450, 1150]];
    quads.forEach(([x0, x1, x2, x3]) => {
      c.beginPath();
      c.moveTo(x0, 100);
      c.lineTo(x1, 100);
      c.lineTo(x3, 980);
      c.lineTo(x2, 980);
      c.closePath();
      c.fill();
    });

    // Dust Motes floating in sunbeams
    if (P.moteCol) {
      c.fillStyle = P.moteCol;
      for (let i = 0; i < 35; i++) {
        const seed = i * 137.5;
        const baseX = 850 + (seed % 900);
        const baseY = 200 + ((seed * 3) % 700);
        const dx = Math.sin(t * 0.8 + i) * 20;
        const dy = -((t * 15 + i * 25) % 300);

        const mx = baseX + dx;
        const my = ((baseY + dy - 100) % 700) + 100;
        const sz = 1.5 + (i % 3) * 0.8;

        c.beginPath(); c.arc(mx, my, sz, 0, Math.PI * 2); c.fill();
      }
    }

    c.restore();
  }

  // --- Diner Main Counter, Stools & Espresso Machine ---
  function drawDinerCounter(c, t, P) {
    c.save();
    const cx = 60, cy = 560, cw = 720, ch = 190;

    // Contact shadow under counter base
    c.fillStyle = 'rgba(0, 0, 0, 0.4)';
    c.fillRect(cx - 10, cy + ch, cw + 20, 25);

    // Counter Base: Ribbed stainless steel / teal paneling
    const baseG = linGrad(c, cx, cy + 30, cx, cy + ch, [
      [0, '#264E52'], [0.5, '#19373B'], [1, '#0C2023']
    ]);
    c.fillStyle = baseG;
    c.fillRect(cx, cy + 30, cw, ch - 30);

    // Stainless steel vertical ridges
    c.strokeStyle = 'rgba(255, 255, 255, 0.08)';
    c.lineWidth = 3;
    for (let x = cx + 20; x < cx + cw; x += 30) {
      c.beginPath(); c.moveTo(x, cy + 30); c.lineTo(x, cy + ch); c.stroke();
    }

    const topG = linGrad(c, cx, cy, cx, cy + 30, [

    ]);
    c.fillStyle = topG;

    const chromeG = linGrad(c, cx - 15, cy + 22, cx - 15, cy + 32, [
      [0, '#FFFFFF'], [0.5, '#78909C'], [1, '#37474F']
    ]);
    c.fillStyle = chromeG;
    drawRR(c, cx - 15, cy + 22, cw + 30, 10, 4); c.fill();

    drawEspressoMachine(c, t, 420, 380);

    // --- Stools (4 stools at X: 160, 310, 460, 610, Y: 710) ---
    [160, 310, 460, 610].forEach(sx => {

    c.restore();

  // --- Stool ---

    c.beginPath(); c.ellipse(x - 12, y + 105, 36, 12, 0, 0, Math.PI * 2); c.fill();

    const baseG = linGrad(c, x - 30, y + 95, x + 30, y + 105, [
      [0, '#ECEFF1'], [0.5, '#78909C'], [1, '#37474F']
    ]);
    c.fillStyle = baseG;
    c.beginPath(); c.ellipse(x, y + 100, 32, 10, 0, 0, Math.PI * 2); c.fill();

    // Chrome Center Pole & Footrest Ring
    const poleG = linGrad(c, x - 8, y, x + 8, y, [
      [0, '#CFD8DC'], [0.5, '#37474F'], [1, '#90A4AE']
    ]);
    c.fillStyle = poleG;

    const seatG = linGrad(c, x - 34, y - 20, x + 34, y + 20, [

  // --- Espresso Machine ---
  function drawEspressoMachine(c, t, mx, my) {
    c.save();
    const mw = 150, mh = 180;

    // Shadow on counter
    c.fillStyle = 'rgba(0, 0, 0, 0.3)';
    c.fillRect(mx - 5, my + mh - 5, mw + 10, 12);

    // Stainless Steel Body
    const bodyG = linGrad(c, mx, my, mx + mw, my + mh, [
      [0, '#ECEFF1'], [0.4, '#B0BEC5'], [0.8, '#546E7A'], [1, '#263238']
    ]);
    c.fillStyle = bodyG;
    drawRR(c, mx, my, mw, mh, 10); c.fill();

    // Top Cup Rail & Warm Mugs on top
    c.fillStyle = '#37474F';
    c.fillRect(mx + 10, my - 8, mw - 20, 8);
    for (let i = 0; i < 3; i++) {
      c.fillStyle = ['#FFF', '#E53935', '#26A69A'][i];
      c.fillRect(mx + 20 + i * 40, my - 22, 22, 14);
    }

    // Front Panel / Pressure Gauges / Portafilters
    c.fillStyle = '#1C2833';
    c.fillRect(mx + 15, my + 30, mw - 30, 80);

    // Pressure Dials
    c.fillStyle = '#FFF';
    c.beginPath(); c.arc(mx + 35, my + 50, 10, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(mx + 65, my + 50, 10, 0, Math.PI * 2); c.fill();

    // Glowing Power LEDs
    c.fillStyle = '#76FF03'; c.beginPath(); c.arc(mx + 115, my + 45, 4, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#FF3D00'; c.beginPath(); c.arc(mx + 115, my + 58, 4, 0, Math.PI * 2); c.fill();

    // Portafilters & Drip Tray
    c.fillStyle = '#78909C';
    c.fillRect(mx + 30, my + 110, 30, 18);
    c.fillRect(mx + 85, my + 110, 30, 18);

    // Glass Coffee Carafes on Warmers (Right side)
    const potX = mx + mw + 15, potY = my + 90;
    c.fillStyle = 'rgba(255, 255, 255, 0.4)'; // glass
    c.beginPath(); c.arc(potX, potY, 22, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#3E2723'; // dark coffee liquid inside
    c.beginPath(); c.arc(potX, potY + 4, 18, 0, Math.PI); c.fill();
    c.fillStyle = '#FF9800'; // orange pot handle
    c.fillRect(potX + 18, potY - 10, 8, 22);

    // --- Animated Steam rising from Machine ---
    for (let i = 0; i < 4; i++) {
      const stY = my + 20 - ((t * 25 + i * 22) % 70);
      const stX = mx + 45 + i * 25 + Math.sin(t * 2.5 + i) * 10;
      const alpha = Math.max(0, 0.35 - (my + 20 - stY) / 100);
      c.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      c.beginPath(); c.arc(stX, stY, 8 + i * 3, 0, Math.PI * 2); c.fill();
    }

    c.restore();
  }

  // --- Hanging Pendant Lamps Swaying ---
  function drawPendantLamps(c, t, P) {
    c.save();

    [280, 700, 1120].forEach((lx, i) => {
      // Gentle pendulum sway formula
      const sway = Math.sin(t * 1.5 + i * 1.2) * 0.04; // sway angle in radians
      const lampLen = 140;

      c.save();
      c.translate(lx, 0); // anchor at ceiling
      c.rotate(sway);

      // Cord
      c.strokeStyle = '#212121'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(0, 0); c.lineTo(0, lampLen); c.stroke();

      // Brass Fixture Cap
      c.fillStyle = '#FFB300';
      c.fillRect(-8, lampLen - 10, 16, 10);

      // Conical Lamp Shade
      const shadeG = linGrad(c, -35, lampLen, 35, lampLen + 40, [
        [0, '#FFB300'], [0.5, '#E65100'], [1, '#BF360C']
      ]);
      c.fillStyle = shadeG;
      c.beginPath();
      c.moveTo(-12, lampLen);
      c.lineTo(12, lampLen);
      c.lineTo(38, lampLen + 42);
      c.lineTo(-38, lampLen + 42);
      c.closePath();
      c.fill();

      // Inner Glowing Bulb
      c.fillStyle = P.lampBulbCol;
      c.beginPath(); c.arc(0, lampLen + 42, 12, 0, Math.PI * 2); c.fill();

      // Lamp Bloom
      if (P.lampGlowRadius > 0) {
        drawRadialGlow(c, 0, lampLen + 48, P.lampGlowRadius, P.lampGlowCol);
      }

      c.restore();
    });

    c.restore();
  }

  // --- Foreground Table Near Edge (Right Side) ---
  function drawForegroundTable(c, t, P) {
    c.save();
    const tx = 1150, ty = 700, tw = 550, th = 220;

    // Contact shadow on the floor (aligned with leg at legX)
    const floorY = 955;
    const legX = tx + tw / 2; // 1425
    const sh = radGrad(c, legX, floorY, 10, legX, floorY, 180, [
      [0, 'rgba(30, 12, 4, 0.45)'],
      [0.6, 'rgba(30, 12, 4, 0.18)'],
      [1, 'rgba(30, 12, 4, 0)']
    ]);
    c.save();
    c.translate(0, floorY);
    c.scale(1, 0.22);
    c.translate(0, -floorY);
    c.fillStyle = sh;
    c.beginPath();
    c.arc(legX, floorY, 180, 0, Math.PI * 2);
    c.fill();
    c.restore();

    // Pedestal leg down to the floor
    const legG = linGrad(c, legX - 15, 0, legX + 15, 0, [
      [0, '#ECEFF1'], [0.35, '#90A4AE'], [1, '#263238']
    ]);
    c.fillStyle = legG;
    c.fillRect(legX - 15, ty + 30, 30, floorY - (ty + 30));

    // Chrome foot plate
    const footG = linGrad(c, 0, floorY - 16, 0, floorY + 4, [
      [0, '#CFD8DC'], [0.5, '#78909C'], [1, '#37474F']
    ]);
    c.fillStyle = footG;
    c.beginPath();
    c.ellipse(legX, floorY, 100, 14, 0, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = 'rgba(255,255,255,0.5)';
    c.beginPath();
    c.ellipse(legX + 15, floorY - 4, 60, 3, 0, 0, Math.PI * 2);
    c.fill();

    // Table top seen slightly from above: top plane + front edge
    const topG = linGrad(c, tx, ty - 46, tx + tw, ty, P.fgTableTopStops);
    c.fillStyle = topG;
    c.beginPath(); c.moveTo(tx + 40, ty - 46); c.lineTo(tx + tw - 40, ty - 46); c.lineTo(tx + tw, ty + 4); c.lineTo(tx, ty + 4); c.closePath(); c.fill();
    c.fillStyle = 'rgba(255, 250, 235, 0.35)';
    c.beginPath(); c.moveTo(tx + tw - 200, ty - 44); c.lineTo(tx + tw - 60, ty - 44); c.lineTo(tx + tw - 110, ty + 2); c.lineTo(tx + tw - 260, ty + 2); c.closePath(); c.fill();
    const tableG = linGrad(c, tx, ty, tx, ty + 40, P.fgTableFrontStops);
    c.fillStyle = tableG;
    drawRR(c, tx, ty, tw, 30, 6); c.fill();

    // Polished Chrome Table Edge Trim
    const chromeG = linGrad(c, tx, ty + 26, tx, ty + 38, [
      [0, '#FFFFFF'], [0.5, '#78909C'], [1, '#37474F']
    ]);
    c.fillStyle = chromeG;
    drawRR(c, tx - 4, ty + 26, tw + 8, 12, 4); c.fill();

    // --- Table Props ---
    // 1. GLASS OF ORANGE JUICE at exported position `window.DINER_GLASS` (x: 1380, y: 730)
    if (!window.DINER_NO_GLASS) drawGlassOfOJ(c, t, window.DINER_GLASS.x, window.DINER_GLASS.y - 45, 1.0);

    // 2. Steaming Coffee Mug
    if (!window.DINER_NO_MUG) drawDinerMug(c, t, 1240, 715);

    // 3. Napkin Dispenser
    drawNapkinDispenser(c, 1550, 680);

    // 4. Salt & Pepper Shakers
    drawSaltPepper(c, 1630, 700);

    c.restore();
  }

  // --- Glass of Orange Juice Prop ---
  function drawGlassOfOJ(c, t, gx, gy, scale = 1.0) {
    c.save();
    c.translate(gx, gy);
    c.scale(scale, scale);

    const gw = 44, gh = 85;

    c.fillStyle = 'rgba(255, 110, 0, 0.35)';

    c.fillStyle = 'rgba(235, 245, 255, 0.3)';
    drawRR(c, -gw/2, 0, gw, gh, 8); c.fill();

    // Orange Juice Liquid Fill (3-stop vibrant gradient)
    const ojG = linGrad(c, 0, 12, 0, gh, [
      [0, '#FFD54F'],   // bright yellow top surface
      [0.4, '#FF9800'], // rich orange
      [1.0, '#E65100']  // deep orange base
    ]);
    c.fillStyle = ojG;
    drawRR(c, -gw/2 + 3, 14, gw - 6, gh - 17, 6); c.fill();

    c.fillStyle = 'rgba(255, 255, 255, 0.55)';
    drawRR(c, -12, 18, 14, 14, 3); c.fill();

    c.strokeStyle = '#FFE082'; c.lineWidth = 5; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-4, gh - 10); c.lineTo(12, -22); c.stroke();

    // Orange Wedge on Glass Rim
    c.fillStyle = '#FF9800';
    c.beginPath(); c.arc(-gw/2, 8, 14, 0, Math.PI); c.fill();
    c.fillStyle = '#FFF3E0'; // rind highlight
    c.beginPath(); c.arc(-gw/2, 8, 14, 0, Math.PI, true); c.stroke();

    // Glass Rim & Highlight Sheen
    c.strokeStyle = 'rgba(255, 255, 255, 0.8)'; c.lineWidth = 2;
    drawRR(c, -gw/2, 0, gw, gh, 8); c.stroke();
    c.fillStyle = 'rgba(255, 255, 255, 0.4)';
    c.fillRect(-gw/2 + 4, 4, 6, gh - 10);

    c.restore();

  // --- Diner Coffee Mug ---
  function drawDinerMug(c, t, mx, my) {
    c.save();
    c.translate(mx, my);

    // Mug Shadow (skipped while falling)
    c.fillStyle = window.MUG_NO_STEAM ? 'rgba(0,0,0,0)' : 'rgba(0, 0, 0, 0.3)';
    c.beginPath(); c.ellipse(0, 26, 20, 7, 0, 0, Math.PI * 2); c.fill();

    // Ceramic Body (Off-white gradient)
    const ceramicG = linGrad(c, -18, -20, 18, 25, [
      [0, '#FFFFFF'], [0.6, '#E0E0E0'], [1, '#BDBDBD']
    ]);
    c.fillStyle = ceramicG;
    drawRR(c, -18, -20, 36, 45, 6); c.fill();

    // Mug Handle
    c.strokeStyle = '#E0E0E0'; c.lineWidth = 5;
    c.beginPath(); c.arc(-18, 2, 12, Math.PI*0.5, Math.PI*1.5); c.stroke();

    // Dark Coffee Liquid inside top
    c.fillStyle = '#3E2723';
    c.beginPath(); c.ellipse(0, -18, 15, 5, 0, 0, Math.PI * 2); c.fill();

    // Rising Steam Wisps (skipped while falling: window.MUG_NO_STEAM)
    for (let i = 0; i < (window.MUG_NO_STEAM?0:2); i++) {
      const stY = -25 - ((t * 20 + i * 25) % 45);
      const stX = Math.sin(t * 3 + i) * 6;
      c.fillStyle = `rgba(255, 255, 255, ${0.4 - (-25 - stY) / 80})`;
      c.beginPath(); c.arc(stX, stY, 4 + i * 2, 0, Math.PI * 2); c.fill();
    }

    c.restore();
  }

  function drawNapkinDispenser(c, nx, ny) {
    c.save();
    c.translate(nx, ny);

    const chromeG = linGrad(c, -20, -30, 20, 30, [
      [0, '#ECEFF1'], [0.5, '#78909C'], [1, '#37474F']
    ]);
    c.fillStyle = chromeG;
    drawRR(c, -20, -30, 40, 55, 6); c.fill();

    // White Napkins extending from sides
    c.fillStyle = '#FFF';
    c.fillRect(-26, -22, 6, 40);
    c.fillRect(20, -22, 6, 40);

    c.restore();

  // --- Salt & Pepper Shakers ---
  function drawSaltPepper(c, sx, sy) {
    c.save();
    c.translate(sx, sy);

    // Salt (White)
    c.fillStyle = 'rgba(255, 255, 255, 0.85)';
    drawRR(c, -16, -18, 14, 28, 4); c.fill();
    c.fillStyle = '#B0BEC5'; // chrome top
    drawRR(c, -16, -24, 14, 8, 2); c.fill();

    // Pepper (Dark)
    c.fillStyle = 'rgba(80, 80, 80, 0.85)';
    drawRR(c, 2, -18, 14, 28, 4); c.fill();
    c.fillStyle = '#B0BEC5';
    drawRR(c, 2, -24, 14, 8, 2); c.fill();

    c.restore();
  }

  // --- Wide FG Layer ---
  function drawWideFG(c, t, P) {
    c.save();

    // Far Left: Corner silhouetted stool/booth edge in foreground for depth
    c.fillStyle = '#1A1822';
    c.beginPath();
    c.arc(-40, 1080, 160, 0, Math.PI * 2);
    c.fill();

    // Far Right Top: Silhouetted Hanging Vine Leaf
    c.fillStyle = '#121A16';
    c.beginPath();
    c.ellipse(1900, 40, 45, 90, 0.4, 0, Math.PI * 2);
    c.fill();

    c.restore();
  }

  // =========================================================================
  // VIEW 2: WINDOW VIEW (Frame-within-frame looking in from outside)
  // =========================================================================
  function drawWindowView(c, t, layer, bgBlur, fgBlur, P) {
    if (layer === 'all' || layer === 'bg' || layer === 'mid') {
      // Draw interior diner in midground
      c.save();
      if (bgBlur > 0) c.filter = `blur(${bgBlur}px)`;
      drawWideView(c, t, 'all', 0, 0, P);
      c.restore();
    }

    if (layer === 'all' || layer === 'fg') {
      // Draw Outside Window Frame & Glass Pane in Foreground
      c.save();
      if (fgBlur > 0) c.filter = `blur(${fgBlur}px)`;

      // Frame border framing the shot
      const frameG = linGrad(c, 0, 0, 0, 1080, P.winFrameStops);
      c.fillStyle = frameG;

      // Outer window surround (120px border)
      c.fillRect(0, 0, 1920, 110);    // top sill
      c.fillRect(0, 970, 1920, 110);   // bottom ledge
      c.fillRect(0, 0, 140, 1080);    // left frame
      c.fillRect(1780, 0, 140, 1080); // right frame

      // Outer Brick Wall Texture Gradient outside
      c.fillStyle = 'rgba(0, 0, 0, 0.25)';
      c.fillRect(0, 0, 1920, 1080);

      // Glass Pane Diagonal Sheen / Dirt / Reflections
      c.fillStyle = 'rgba(255, 255, 255, 0.08)';
      c.beginPath();
      c.moveTo(200, 110); c.lineTo(600, 110); c.lineTo(350, 970); c.lineTo(140, 970);
      c.fill();

      // "OPEN" Retro Neon Sign in Top-Left Glass Corner
      const neonX = 240, neonY = 180;
      c.shadowColor = P.neonShadowCol;
      c.shadowBlur = P.neonBlur;
      c.strokeStyle = P.neonStrokeCol;
      c.lineWidth = 6;
      c.strokeRect(neonX, neonY, 140, 60);

      c.fillStyle = P.neonTextCol;
      c.font = 'bold 28px sans-serif';
      c.textAlign = 'center';
      c.fillText('OPEN', neonX + 70, neonY + 40);
      c.shadowBlur = 0;

      c.restore();
    }
  }

  // =========================================================================
  // VIEW 3: TABLE CU VIEW (Close-up insert of table & OJ glass)
  // =========================================================================
  function drawTableCU(c, t, layer, bgBlur, fgBlur, P) {
    if (layer === 'all' || layer === 'bg') {
      // Soft Blurred Diner Interior in Background
      c.save();
      const bgB = bgBlur || 12;
      c.filter = `blur(${bgB}px)`;

      // Wall gradient
      c.fillStyle = linGrad(c, 0, 0, 0, 600, P.cuBGStops);
      c.fillRect(0, 0, 1920, 600);

      // Distant window sun beams
      drawSunShafts(c, t, P);

      c.restore();
    }

    if (layer === 'all' || layer === 'mid') {
      c.save();

      // Foreground Table Surface (Y: 440..1080)
      const tableG = linGrad(c, 0, 440, 0, 1080, P.cuTableStops);
      c.fillStyle = tableG;
      c.fillRect(0, 440, 1920, 640);

      // Wood Grain Lines
      c.strokeStyle = 'rgba(0, 0, 0, 0.08)';
      c.lineWidth = 4;
      for (let y = 460; y < 1080; y += 40) {
        c.beginPath(); c.moveTo(0, y); c.lineTo(1920, y + 20); c.stroke();
      }

      // Sunbeam Light Cast on Table
      const sunBeamG = linGrad(c, 1400, 440, 400, 1080, P.cuSunBeamStops);
      c.fillStyle = sunBeamG;
      c.beginPath();
      c.moveTo(800, 440); c.lineTo(1920, 440); c.lineTo(1600, 1080); c.lineTo(200, 1080);
      c.fill();

      // --- HERO PROP: Large CU Glass of Orange Juice (Center X: 960, Y: 560) ---
      if (!window.DINER_NO_GLASS) drawGlassOfOJ(c, t, 960, 560, 2.2); // cup3: S9 draws its own moving glass

      // --- Accompanying Table Props ---
      // Steaming Coffee Cup (Left X: 520, Y: 720)
      drawDinerMug(c, t, 520, 720);

      // Stainless Steel Napkin Dispenser (Right X: 1450, Y: 620)
      drawNapkinDispenser(c, 1450, 620);

      // Salt & Pepper Shakers (Far Right X: 1680, Y: 680)
      drawSaltPepper(c, 1680, 680);

      // Plate with Toast & Melting Butter (X: 720, Y: 860)
      c.fillStyle = '#FFFFFF';
      c.beginPath(); c.ellipse(720, 880, 90, 32, 0, 0, Math.PI * 2); c.fill(); // plate
      c.fillStyle = '#D7CCC8';
      drawRR(c, 670, 855, 100, 45, 8); c.fill(); // toast
      c.fillStyle = '#FFC107';
      c.fillRect(710, 868, 20, 14); // butter square

      c.restore();
    }

    if (layer === 'all' || layer === 'fg') {
      c.save();
      if (fgBlur > 0) c.filter = `blur(${fgBlur}px)`;
      // Soft vignette around edges
      drawRadialGlow(c, 960, 540, 1100, 'rgba(0, 0, 0, 0.25)');
      c.restore();
    }
  }

  window.drawDinerMug = drawDinerMug;
})();

  // Helper: Create rounded rectangle path
  function rrect(c, x, y, w, h, r) {
    if (typeof r === 'number') r = [r, r, r, r];
    const [tl, tr, br, bl] = r;
    c.beginPath();
    c.moveTo(x + tl, y);
    c.lineTo(x + w - tr, y);
    c.quadraticCurveTo(x + w, y, x + w, y + tr);
    c.lineTo(x + w, y + h - br);
    c.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
    c.lineTo(x + bl, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - bl);
    c.lineTo(x, y + tl);
    c.quadraticCurveTo(x, y, x + tl, y);
    c.closePath();
  }

  // Helper: Rounded Quad for Perspective Windows
  function rquad(c, p1, p2, p3, p4, r) {
    c.beginPath();
    c.moveTo((p4.x + p1.x) / 2, (p4.y + p1.y) / 2);
    c.arcTo(p1.x, p1.y, p2.x, p2.y, r);
    c.arcTo(p2.x, p2.y, p3.x, p3.y, r);
    c.arcTo(p3.x, p3.y, p4.x, p4.y, r);
    c.arcTo(p4.x, p4.y, p1.x, p1.y, r);
    c.closePath();

    g.addColorStop(1, col1 || 'rgba(0,0,0,0)');
    c.fillStyle = g;
    c.beginPath();
    c.arc(x, y, r, 0, Math.PI * 2);
    c.fill();
    c.restore();

    return { x: pos.x, y: pos.y, s: seats[row].s };

      mountains: ['#090d1a', '#050812'],
      treeTrunk: '#121620',
      treeLeaves: ['#08120c', '#040a06'],
      treeLeavesAisle1: '#0a160e',
      treeLeavesAisle2: '#050c07',
      treeLeavesAisleL: '#0a160e',
      treeLeavesAisleR: '#061008',
      floor: ['#161920', '#0e1015', '#08090d'],
      floorSide: ['#161920', '#0e1015', '#08090d'],
      aisleStripe: '#7a5a00',
      sunSweepAisle: ['rgba(255, 180, 80, 0.15)', 'rgba(255, 140, 40, 0.05)'],
      sunSweepFloor: 'rgba(255, 170, 70, 0.10)',
      sunSweepSide: ['rgba(255, 180, 80, 0.18)', 'rgba(255, 140, 40, 0.06)'],
      sideWall: ['#3c3a46', '#282633', '#181622', '#0c0b12'],
      sidePillar: '#3d3012',
      sidePillarDark: '#2b2209',

  // Helper: Draw clouds in window clips
  function drawClouds(c, x0, y0, w, h, pal, t, seed) {
    if (!pal.clouds) return;
    c.save();
    for (let idx = 0; idx < 3; idx++) {
      const cx = x0 + ((t * 20 + idx * 120 + seed * 90) % (w + 140)) - 70;
      const cy = y0 + 15 + idx * 22;
      const cr = 20 + (seed * 7 + idx * 11) % 18;

      c.fillStyle = pal.cloudShadow;
      c.beginPath();
      c.arc(cx + 4, cy + 5, cr, 0, Math.PI * 2);
      c.arc(cx + cr * 0.7 + 4, cy + 7, cr * 0.75, 0, Math.PI * 2);
      c.fill();

      c.fillStyle = pal.cloudColor;
      c.beginPath();
      c.arc(cx, cy, cr, 0, Math.PI * 2);
      c.arc(cx + cr * 0.7, cy + 2, cr * 0.75, 0, Math.PI * 2);
      c.arc(cx - cr * 0.6, cy + 4, cr * 0.65, 0, Math.PI * 2);
      c.fill();
    }
    c.restore();
  }

  // Helper: Draw night stars in window clips
  function drawStars(c, x0, y0, w, h, t, seed) {
    c.save();
    c.fillStyle = '#ffffff';
    for (let i = 0; i < 8; i++) {
      const sx = x0 + ((seed * 37 + i * 53) % w);
      const sy = y0 + ((seed * 19 + i * 29) % (h * 0.7));
      const alpha = 0.3 + 0.7 * Math.abs(Math.sin(t * 3 + i + seed));
      c.globalAlpha = alpha;
      c.beginPath();
      c.arc(sx, sy, 1.5, 0, Math.PI * 2);
      c.fill();
    }
    c.restore();
  }

  // Helper: Scenery inside perspective aisle window
  function drawAisleWindowScenery(c, p1, p2, p3, p4, kMid, isRight, pal, t, winIdx) {
    const minX = Math.min(p1.x, p2.x, p3.x, p4.x);
    const maxX = Math.max(p1.x, p2.x, p3.x, p4.x);
    const minY = Math.min(p1.y, p2.y, p3.y, p4.y);
    const maxY = Math.max(p1.y, p2.y, p3.y, p4.y);
    const winW = Math.max(1, maxX - minX);
    const winH = Math.max(1, maxY - minY);

    // 1. Sky Gradient
    const skyGrad = c.createLinearGradient(0, minY, 0, maxY);
    skyGrad.addColorStop(0, pal.skyAisleSide[0]);
    skyGrad.addColorStop(0.6, pal.skyAisleSide[1]);
    skyGrad.addColorStop(1, pal.skyAisleSide[2]);
    c.fillStyle = skyGrad;
    c.fillRect(minX - 10, minY - 10, winW + 20, winH + 20);

    if (pal.stars) drawStars(c, minX, minY, winW, winH, t, winIdx + 1);
    if (pal.clouds) drawClouds(c, minX, minY, winW, winH, pal, t, winIdx + 1);

    // 2. Distant Hills / Mountains
    c.fillStyle = pal.mountains[0];
    c.beginPath();
    c.moveTo(minX - 10, maxY);
    c.lineTo(minX + winW * 0.3, minY + winH * 0.55);
    c.lineTo(minX + winW * 0.7, minY + winH * 0.65);
    c.lineTo(maxX + 10, maxY);
    c.closePath();
    c.fill();

    // 3. Scrolling Houses & Trees (Parallax Motion)
    // Bus moving forward means scenery moves toward rear (right for left windows, left for right windows)
    const dir = isRight ? -1 : 1;
    const scrollSpeed = t * 240 * dir;

    // Houses
    const housePeriod = 320;
    for (let h = -1; h <= 2; h++) {
      let hx = minX + ((scrollSpeed * 0.6 + (h + winIdx * 0.5) * housePeriod) % (winW + housePeriod));
      if (hx < minX - 100) hx += winW + housePeriod;
      if (hx > maxX + 100) hx -= winW + housePeriod;

      const hw = lerp(50, 20, kMid);
      const hh = lerp(40, 16, kMid);
      const hy = maxY - hh - lerp(12, 4, kMid);

      // House Wall
      c.fillStyle = pal.isNight ? '#1b2230' : '#f0e6d2';
      c.fillRect(hx, hy, hw, hh);

      // House Roof
      c.fillStyle = pal.isNight ? '#121622' : '#a84632';
      c.beginPath();
      c.moveTo(hx - hw * 0.1, hy);
      c.lineTo(hx + hw * 0.5, hy - hh * 0.4);
      c.lineTo(hx + hw * 1.1, hy);
      c.closePath();
      c.fill();

      // House Window
      c.fillStyle = pal.isNight ? '#ffcc44' : '#7ec2e8';
      c.fillRect(hx + hw * 0.3, hy + hh * 0.25, hw * 0.35, hh * 0.35);
    }

    // Green Trees
    const treePeriod = 220;
    for (let tr = -1; tr <= 3; tr++) {
      let tx = minX + ((scrollSpeed + (tr + winIdx * 0.7) * treePeriod) % (winW + treePeriod));
      if (tx < minX - 80) tx += winW + treePeriod;
      if (tx > maxX + 80) tx -= winW + treePeriod;

      const trunkW = Math.max(3, lerp(10, 3, kMid));
      const trunkH = lerp(55, 20, kMid);
      const leafR = lerp(32, 12, kMid);
      const basey = maxY - lerp(8, 2, kMid);

      // Trunk
      c.fillStyle = pal.treeTrunk;
      c.fillRect(tx - trunkW * 0.5, basey - trunkH, trunkW, trunkH);

      // Layered Foliage
      c.fillStyle = isRight ? pal.treeLeavesAisleR : pal.treeLeavesAisleL;
      c.beginPath();
      c.arc(tx, basey - trunkH, leafR, 0, Math.PI * 2);
      c.fill();

      c.fillStyle = pal.treeLeaves[1] || pal.treeLeaves[0];
      c.beginPath();
      c.arc(tx - leafR * 0.3, basey - trunkH + leafR * 0.2, leafR * 0.75, 0, Math.PI * 2);
      c.fill();
    }

    // 4. Soft Glass Reflection Streak
    c.fillStyle = pal.isNight ? 'rgba(255, 255, 255, 0.12)' : 'rgba(255, 255, 255, 0.18)';
    c.beginPath();
    c.moveTo(p1.x, p1.y);
    c.lineTo(p1.x + (p2.x - p1.x) * 0.45, p1.y + (p2.y - p1.y) * 0.45);
    c.lineTo(p4.x, p4.y + (p3.y - p4.y) * 0.7);
    c.closePath();
    c.fill();
  }

  // Helper: Draw one perspective window frame
  function drawPerspectiveWindow(c, P1, P2, P3, P4, kMid, isRight, pal, t, winIdx) {
    const r = lerp(16, 5, kMid);

    // 1. Clip and draw scenery inside glass
    c.save();
    rquad(c, P1, P2, P3, P4, r);
    c.clip();
    {
      const pf = (c.filter && c.filter !== 'none') ? c.filter + ' ' : '';
      c.filter = pf + 'blur(2px)';
    }

    drawAisleWindowScenery(c, P1, P2, P3, P4, kMid, isRight, pal, t, winIdx);
    c.restore();

    // 2. Dark Rubber Border Frame
    c.save();
    c.strokeStyle = pal.isNight ? '#121016' : '#221b16';
    c.lineWidth = Math.max(2, lerp(12, 4, kMid));
    rquad(c, P1, P2, P3, P4, r);
    c.stroke();

    // 3. Inner Gasket / Metal Trim
    c.strokeStyle = pal.isNight ? '#383240' : '#524336';
    c.lineWidth = Math.max(1, lerp(3, 1, kMid));
    const inset = lerp(4, 1.5, kMid);
    const inP1 = { x: P1.x + inset * (isRight ? -1 : 1), y: P1.y + inset };
    const inP2 = { x: P2.x + inset * (isRight ? -1 : 1), y: P2.y + inset };
    const inP3 = { x: P3.x + inset * (isRight ? -1 : 1), y: P3.y - inset };
    const inP4 = { x: P4.x + inset * (isRight ? -1 : 1), y: P4.y - inset };
    rquad(c, inP1, inP2, inP3, inP4, Math.max(2, r - 2));
    c.stroke();
    c.restore();
  }

  // =============================================================================
  // 1. AISLE VIEW (Looking down central rubber aisle towards rear emergency door)
  // =============================================================================
  function drawAisleView(c, t, o) {
    const layer = o.layer || 'all';
    const bgBlur = o.bgBlur || 0;
    const fgBlur = o.fgBlur || 0;
    const todKey = (o && o.tod && PALETTES[o.tod]) ? o.tod : 'afternoon';
    const pal = PALETTES[todKey];

    // Bus sway & engine vibration
    const swayY = Math.sin(t * 11) * 3.2 + Math.sin(t * 6.5) * 1.8;
    const swayX = Math.cos(t * 5.2) * 1.5;
    const swayRot = Math.sin(t * 4.2) * 0.002;

    c.save();
    c.translate(swayX, swayY);
    c.rotate(swayRot);

    const vpX = 960;
    const vpY = 480; // Vanishing point at rear center window

    // --- BACKGROUND LAYER ---
    if (layer === 'bg' || layer === 'all') {
      c.save();
      if (bgBlur > 0) c.filter = `blur(${bgBlur}px)`;

      // Bus Outer Ceiling & Wall Shell (Perspective funnel)
      const ceilGrad = c.createLinearGradient(0, 0, 0, vpY);
      ceilGrad.addColorStop(0, pal.ceil[0]);
      ceilGrad.addColorStop(0.5, pal.ceil[1]);
      ceilGrad.addColorStop(1, pal.ceil[2]);
      c.fillStyle = ceilGrad;
      c.beginPath();
      c.moveTo(0, 0);
      c.lineTo(1920, 0);
      c.lineTo(vpX + 280, vpY - 140);
      c.lineTo(vpX - 280, vpY - 140);
      c.closePath();
      c.fill();

      // Yellow Side Wall Shell (Left & Right)
      const wallGradL = c.createLinearGradient(0, 0, vpX - 280, vpY);
      wallGradL.addColorStop(0, pal.wallL[0]);
      wallGradL.addColorStop(0.6, pal.wallL[1]);
      wallGradL.addColorStop(1, pal.wallL[2]);
      c.fillStyle = wallGradL;
      c.beginPath();
      c.moveTo(0, 0);
      c.lineTo(vpX - 280, vpY - 140);
      c.lineTo(vpX - 280, vpY + 200);
      c.lineTo(0, 1080);
      c.closePath();
      c.fill();

      const wallGradR = c.createLinearGradient(1920, 0, vpX + 280, vpY);
      wallGradR.addColorStop(0, pal.wallR[0]);
      wallGradR.addColorStop(0.6, pal.wallR[1]);
      wallGradR.addColorStop(1, pal.wallR[2]);
      c.fillStyle = wallGradR;
      c.beginPath();
      c.moveTo(1920, 0);
      c.lineTo(vpX + 280, vpY - 140);
      c.lineTo(vpX + 280, vpY + 200);
      c.lineTo(1920, 1080);
      c.closePath();
      c.fill();

      // --- REAR EMERGENCY DOOR & REAR WINDOW ---
      c.fillStyle = pal.doorBg;
      c.fillRect(vpX - 240, vpY - 150, 480, 360);

      // Rear Door Frame
      const doorGrad = c.createLinearGradient(vpX - 180, 0, vpX + 180, 0);
      doorGrad.addColorStop(0, pal.doorFrame[0]);
      doorGrad.addColorStop(0.5, pal.doorFrame[1]);
      doorGrad.addColorStop(1, pal.doorFrame[2]);
      c.fillStyle = doorGrad;
      rrect(c, vpX - 170, vpY - 140, 340, 340, 12);
      c.fill();

      // Rear Window Glass with Parallax Outside
      c.save();
      rrect(c, vpX - 130, vpY - 110, 260, 180, 16);
      c.clip();
      {
        const pf = (c.filter && c.filter !== 'none') ? c.filter + ' ' : '';
        c.filter = pf + 'blur(2px)';
      }

      // Sky
      const skyGrad = c.createLinearGradient(0, vpY - 110, 0, vpY + 70);
      skyGrad.addColorStop(0, pal.skyAisleRear[0]);
      skyGrad.addColorStop(0.6, pal.skyAisleRear[1]);
      skyGrad.addColorStop(1, pal.skyAisleRear[2]);
      c.fillStyle = skyGrad;
      c.fillRect(vpX - 130, vpY - 110, 260, 180);

      if (pal.stars) drawStars(c, vpX - 130, vpY - 110, 260, 180, t, 1);
      if (pal.clouds) drawClouds(c, vpX - 130, vpY - 110, 260, 180, pal, t, 1);

      // Distant City Skyline
      const cityX = (t * 70) % 300;
      c.fillStyle = pal.citySkyline;
      for (let i = -2; i < 5; i++) {
        const bx = vpX - 130 + i * 80 - cityX;
        const bh = 45 + (Math.abs(i * 17) % 35);
        c.fillRect(bx, vpY + 20 - bh, 65, bh);
        if (pal.cityLights) {
          c.save();
          c.fillStyle = '#ffcc44';
          for (let wy = vpY + 25 - bh; wy < vpY + 15; wy += 10) {
            c.fillRect(bx + 10, wy, 4, 4);
            c.fillRect(bx + 25, wy, 4, 4);
            c.fillRect(bx + 42, wy, 4, 4);
          }
          c.restore();
        }
      }

      // Fast Trees (Parallax speed 2)
      const treeX = (t * 220) % 200;
      for (let i = -2; i < 5; i++) {
        const tx = vpX - 130 + i * 110 - treeX;
        c.fillStyle = pal.treeLeavesAisle1;
        c.beginPath();
        c.arc(tx + 25, vpY + 15, 30, 0, Math.PI * 2);
        c.fill();
        c.fillStyle = pal.treeLeavesAisle2;
        c.beginPath();
        c.arc(tx + 18, vpY + 20, 22, 0, Math.PI * 2);
        c.fill();
      }

      // Glass glint reflection
      c.fillStyle = pal.isNight ? 'rgba(255, 255, 255, 0.25)' : 'rgba(255, 255, 255, 0.18)';
      c.beginPath();
      c.moveTo(vpX - 130, vpY - 110);
      c.lineTo(vpX - 60, vpY - 110);
      c.lineTo(vpX - 130, vpY + 40);
      c.closePath();
      c.fill();

      c.restore(); // end rear window clip

      // Emergency Door Red Release Bar
      c.fillStyle = '#c82323';
      rrect(c, vpX - 120, vpY + 100, 240, 16, 4);
      c.fill();
      c.fillStyle = '#222';
      c.fillRect(vpX - 10, vpY + 80, 20, 50);

      // --- SIDE WINDOWS IN PERSPECTIVE ---
      // Left Side Windows (4 Perspective Windows)
      for (let i = 0; i < 4; i++) {
        const k1 = 0.04 + i * 0.22;
        const k2 = k1 + 0.16;
        const kMid = (k1 + k2) / 2;

        const P1 = { x: lerp(0, 680, k1), y: lerp(120, 330, k1) };
        const P2 = { x: lerp(0, 680, k2), y: lerp(120, 330, k2) };
        const P3 = { x: lerp(0, 680, k2), y: lerp(620, 530, k2) };
        const P4 = { x: lerp(0, 680, k1), y: lerp(620, 530, k1) };

        drawPerspectiveWindow(c, P1, P2, P3, P4, kMid, false, pal, t, i);
      }

      // Right Side Windows (4 Perspective Windows)
      for (let i = 0; i < 4; i++) {
        const k1 = 0.04 + i * 0.22;
        const k2 = k1 + 0.16;
        const kMid = (k1 + k2) / 2;

        const P1 = { x: lerp(1920, 1240, k1), y: lerp(120, 330, k1) };
        const P2 = { x: lerp(1920, 1240, k2), y: lerp(120, 330, k2) };
        const P3 = { x: lerp(1920, 1240, k2), y: lerp(620, 530, k2) };
        const P4 = { x: lerp(1920, 1240, k1), y: lerp(620, 530, k1) };

        drawPerspectiveWindow(c, P1, P2, P3, P4, kMid, true, pal, t, i);
      }

      // AISLE FLOOR
      const floorGrad = c.createLinearGradient(0, vpY + 120, 0, 1080);
      floorGrad.addColorStop(0, pal.floor[0]);
      floorGrad.addColorStop(0.5, pal.floor[1]);
      floorGrad.addColorStop(1, pal.floor[2]);
      c.fillStyle = floorGrad;
      c.beginPath();
      c.moveTo(vpX - 160, vpY + 120);
      c.lineTo(vpX + 160, vpY + 120);
      c.lineTo(1350, 1080);
      c.lineTo(570, 1080);
      c.closePath();
      c.fill();

      // Light sweeps/stripes across aisle floor
      c.save();
      c.globalCompositeOperation = 'lighter';
      for (let k = 0; k < 4; k++) {
        const ph = ((t * 0.35 + k * 0.27) % 1);
        const y0 = vpY + 120 + Math.pow(ph, 1.6) * (1080 - vpY - 120);
        const hh = 10 + ph * 60;
        const w0 = 160 + ph * (390 - 160);
        c.fillStyle = pal.sunSweepFloor;
        c.fillRect(vpX - w0, y0, w0 * 2, hh);
      }
      c.restore();

      // Yellow Aisle Border Stripes
      c.strokeStyle = pal.aisleStripe;
      c.lineWidth = 5;
      c.beginPath();
      c.moveTo(vpX - 158, vpY + 120);
      c.lineTo(575, 1080);
      c.moveTo(vpX + 158, vpY + 120);
      c.lineTo(1345, 1080);
      c.stroke();

      // Aisle Ribbed Texture
      c.strokeStyle = 'rgba(0, 0, 0, 0.4)';
      c.lineWidth = 2;
      for (let r = 1; r <= 14; r++) {
        const k = r / 14;
        const ry = vpY + 120 + Math.pow(k, 1.8) * (1080 - (vpY + 120));
        const rx1 = vpX - 158 + k * (575 - (vpX - 158));
        const rx2 = vpX + 158 + k * (1345 - (vpX + 158));
        c.beginPath();
        c.moveTo(rx1, ry);
        c.lineTo(rx2, ry);
        c.stroke();
      }

      c.restore(); // end bgBlur save
    }

    // --- SEAT ROW DRAWING HELPER ---
    const drawSeatRow = (rowIdx, zFactor, leftX, rightX, topY, seatW, seatH) => {
      // Floor shadow
      c.save();
      c.fillStyle = 'rgba(0, 0, 0, 0.42)';
      c.beginPath();
      c.ellipse(leftX + seatW * 0.5, topY + seatH + 10, seatW * 0.55, Math.max(1, 12 * zFactor), 0, 0, Math.PI * 2);
      c.ellipse(rightX + seatW * 0.5, topY + seatH + 10, seatW * 0.55, Math.max(1, 12 * zFactor), 0, 0, Math.PI * 2);
      c.fill();
      c.restore();

      // Left Seat
      const seatGradL = c.createLinearGradient(leftX, topY, leftX, topY + seatH);
      seatGradL.addColorStop(0, pal.seatGrad[0]);
      seatGradL.addColorStop(0.4, pal.seatGrad[1]);
      seatGradL.addColorStop(1, pal.seatGrad[2]);
      // aisle-side thickness face (padded block, faces the aisle)
      const thick=(x0,dir)=>{const d=34*zFactor;c.fillStyle=pal.seatGrad[2];c.beginPath();const ex=dir>0?x0+seatW:x0;c.moveTo(ex,topY+10*zFactor);c.lineTo(ex+dir*d,topY+22*zFactor);c.lineTo(ex+dir*d,topY+seatH+14*zFactor);c.lineTo(ex,topY+seatH);c.closePath();c.fill();c.fillStyle='rgba(0,0,0,.18)';c.fill();
        // seat pan cushion in front
        c.fillStyle=pal.seatGrad[1];rrect(c,x0-6*zFactor,topY+seatH*0.72,seatW+12*zFactor,seatH*0.3,10*zFactor);c.fill();c.fillStyle='rgba(255,255,255,.10)';rrect(c,x0,topY+seatH*0.72,seatW,6*zFactor,4*zFactor);c.fill();c.fillStyle='rgba(0,0,0,.22)';rrect(c,x0-6*zFactor,topY+seatH*0.94,seatW+12*zFactor,seatH*0.08,6*zFactor);c.fill();};
      c.fillStyle = seatGradL;
      rrect(c, leftX, topY, seatW, seatH, [22 * zFactor, 22 * zFactor, 8 * zFactor, 8 * zFactor]);
      c.fill();
      // padded vinyl highlight + contour
      c.fillStyle='rgba(255,255,255,.12)';rrect(c,leftX+8*zFactor,topY+8*zFactor,seatW*0.35,seatH*0.55,14*zFactor);c.fill();

      // Stitching
      c.strokeStyle = 'rgba(12, 38, 20, 0.5)';
      c.lineWidth = Math.max(1, 2.5 * zFactor);
      for (let s = 1; s <= 3; s++) {
        const sx = leftX + (s / 4) * seatW;
        c.beginPath();
        c.moveTo(sx, topY + 12 * zFactor);
        c.lineTo(sx, topY + seatH - 8 * zFactor);
        c.stroke();
      }

      // Cushion Top Roll
      const rollGrad = c.createLinearGradient(leftX, topY - 4 * zFactor, leftX, topY + 20 * zFactor);
      rollGrad.addColorStop(0, pal.seatRoll[0]);
      rollGrad.addColorStop(1, pal.seatRoll[1]);
      c.fillStyle = rollGrad;
      rrect(c, leftX - 2 * zFactor, topY - 4 * zFactor, seatW + 4 * zFactor, 22 * zFactor, 8 * zFactor);
      c.fill();

      // Yellow Metal Grab Rail
      c.fillStyle = pal.seatRail;
      rrect(c, leftX + 4 * zFactor, topY - 12 * zFactor, seatW - 8 * zFactor, 10 * zFactor, 4 * zFactor);
      c.fill();
      c.fillStyle = '#fff4a8';
      c.fillRect(leftX + 8 * zFactor, topY - 10 * zFactor, seatW - 16 * zFactor, 2 * zFactor);

      // Support Leg
      c.fillStyle = '#1c1f24';
      c.fillRect(leftX + seatW * 0.7, topY + seatH - 4, 10 * zFactor, 35 * zFactor);
      thick(leftX,1);

      // Right Seat
      const seatGradR = c.createLinearGradient(rightX, topY, rightX, topY + seatH);
      seatGradR.addColorStop(0, pal.seatGrad[0]);
      seatGradR.addColorStop(0.4, pal.seatGrad[1]);
      seatGradR.addColorStop(1, pal.seatGrad[2]);
      c.fillStyle = seatGradR;
      rrect(c, rightX, topY, seatW, seatH, [22 * zFactor, 22 * zFactor, 8 * zFactor, 8 * zFactor]);
      c.fill();
      c.fillStyle='rgba(255,255,255,.12)';rrect(c,rightX+seatW*0.55,topY+8*zFactor,seatW*0.35,seatH*0.55,14*zFactor);c.fill();

      // Stitching
