name: vision
on:
  workflow_dispatch:
    inputs:
      img: {required: true}
      prompt: {required: true}
      model: {default: "openai/gpt-4.1"}
permissions:
  contents: read
  models: read
jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 vision/ask.py "${{ inputs.img }}" "${{ inputs.prompt }}" "${{ inputs.model }}"
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/upload-artifact@v4
        with: {name: answer, path: answer.txt}
